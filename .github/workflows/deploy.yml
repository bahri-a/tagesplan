# AUTOMATISCH VERÖFFENTLICHEN
# ===========================
# Bei jedem Push auf den Branch „main“ baut GitHub die App, lässt die Tests
# laufen und stellt das Ergebnis auf GitHub Pages online.
# Den Fortschritt siehst du auf GitHub im Reiter „Actions“.

name: Veröffentlichen auf GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt auch einen Start per Knopfdruck im Reiter „Actions“.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Bibliotheken installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: App bauen
        run: npm run build
        env:
          # Die App liegt unter https://<name>.github.io/<repository>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
