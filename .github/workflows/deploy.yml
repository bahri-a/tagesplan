# AUTOMATISCH VERÖFFENTLICHEN
# ===========================
# Bei jedem Push auf den Branch „main“ baut GitHub die App, lässt die Tests
# laufen und stellt das Ergebnis auf GitHub Pages online.
# Den Fortschritt siehst du auf GitHub im Reiter „Actions“.
#
# ZURÜCK ZU EINER FRÜHEREN VERSION (ohne am Code etwas zu ändern):
# Reiter „Actions“ → „Veröffentlichen auf GitHub Pages“ → „Run workflow“ →
# bei „Version“ im Auswahlfeld „Old Design Version 1“ wählen → „Run workflow“.
# „Old Design Version 1“ = die App vor dem Umbau (Stand 5. Oktober 2026), zusätzlich
# als Branch „old-design-version-1“ gesichert.
# Nach 1–2 Minuten ist genau diese Version online. Zurück zur neuesten: dasselbe mit „Neueste“.
# Auch der nächste Push auf main veröffentlicht wieder die neueste Version.
# Weitere feste Stände: unten bei „Version wählen“ eine Zeile ergänzen.

name: Veröffentlichen auf GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt auch einen Start per Knopfdruck im Reiter „Actions“ – auf Wunsch mit einer früheren Version.
  workflow_dispatch:
    inputs:
      version:
        description: 'Welche Version?'
        type: choice
        default: 'Neueste'
        options:
          - 'Neueste'
          - 'Old Design Version 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Version wählen
        id: version
        # Jede feste Version ist eine Commit-Kennung. „Neueste“ = der Stand, der den Lauf ausgelöst hat.
        run: |
          case "${{ inputs.version }}" in
            'Old Design Version 1') echo "ref=0120f916d5c087617bd4a344313434d336bd1e43" >> "$GITHUB_OUTPUT" ;;
            *) echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Code holen
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.ref }}

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Bibliotheken installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: App bauen
        run: npm run build
        env:
          # Die App liegt unter https://<name>.github.io/<repository>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
